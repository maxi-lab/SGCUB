services:
  db:
    image: postgres:15-alpine
    container_name: sgcub_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: sgcub_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=sgcub_db
      - DB_USER=sgcub_user
      - DB_PASSWORD=sgcub_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend/SGCUB
    container_name: sgcub_frontend
    command: npm run dev -- --host  # El --host es CRÍTICO para que Vite funcione en Docker
    volumes:
      - ./Frontend/SGCUB:/app
      - /app/node_modules # Evita sobreescribir los módulos de node
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda al hot-reload en Windows
      - WATCHPACK_POLLING=true

volumes:
  postgres_data: